<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: blob:;
                 font-src 'self';
                 connect-src 'self' http://127.0.0.1:* http://localhost:*;
                 media-src 'self' blob:;
                 object-src 'none';
                 base-uri 'none'" />
  <title>Artemis</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/app_logo.svg" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/icons.css" />
  <link rel="stylesheet" href="styles/titlebar.css" />
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/history.css" />
  <link rel="stylesheet" href="styles/tooltip.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <link rel="stylesheet" href="styles/settings-api-keys.css" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="ai/ai.css" />
</head>
<body>
  <div class="app">
    <header id="titlebar" class="titlebar"></header>
    <div class="body">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main"></main>
    </div>
  </div>

  <!-- Adds x-artemis-token to every loopback /api request. Must run first. -->
  <script src="js/agent-auth.js"></script>

  <!-- Vendored browser libraries (no CDN access under Electron CSP) -->
  <script src="vendor/marked/marked.umd.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
  <script src="vendor/highlightjs/highlight.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>

  <!-- Bundled greeting dictionary (replaces file:// JSON fetches) -->
  <script src="ai/data/greetings.js"></script>

  <!-- Markdown subsystem -->
  <script src="ai/components/markdown/core/config.js"></script>
  <script src="ai/components/markdown/core/utils.js"></script>
  <script src="ai/components/markdown/core/sanitize.js"></script>
  <script src="ai/components/markdown/renderers/code.js"></script>
  <script src="ai/components/markdown/renderers/table.js"></script>
  <script src="ai/components/markdown/renderers/blockquote.js"></script>
  <script src="ai/components/markdown/renderers/link.js"></script>
  <script src="ai/components/markdown/renderers/image.js"></script>
  <script src="ai/components/markdown/runtime/actions.js"></script>
  <script src="ai/components/markdown/runtime/enhance.js"></script>
  <script src="ai/components/markdown/runtime/stream.js"></script>
  <script src="ai/components/markdown/markdown.js"></script>

  <!-- Artemis AI components -->
  <script src="ai/components/message-actions/message-actions.js"></script>
  <script src="ai/components/message-actions/user-message-actions.js"></script>
  <script src="ai/components/attachments/file-icons.js"></script>
  <script src="ai/components/sources/sources-model.js"></script>
  <script src="ai/components/sources/sources-popover.js"></script>
  <script src="ai/components/sources/sources-view.js"></script>
  <script src="ai/components/attachments/attachments.js"></script>
  <script src="ai/components/greeting/dynamic-greeting.js"></script>
  <script src="ai/components/thinking/pixel-loader.js"></script>
  <script src="ai/components/thinking/thinking-session.js"></script>
  <script src="ai/components/thinking/thinking-view.js"></script>
  <script src="ai/components/chat/chat.js"></script>
  <script src="ai/components/model-selector/model-selector.js"></script>
  <script src="ai/components/input/voice-waveform.js"></script>
  <script src="ai/components/input/ai-input.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
